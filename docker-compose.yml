services:
    postgres:
        image: pgvector/pgvector:pg17
        restart: unless-stopped
        environment:
            POSTGRES_USER: continuum
            POSTGRES_PASSWORD: continuum
            POSTGRES_DB: continuum
        ports:
            - "5434:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U continuum -d continuum"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres_data:
